name: MA200 Screener

on:
  schedule:
    # 09:05 UTC = 16:05 giờ Việt Nam — sau khi phiên ATC đóng cửa
    - cron: '5 9 * * 1-5'
  workflow_dispatch:  # cho phép chạy thủ công

permissions:
  contents: write

jobs:
  ma200-screener:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install pandas requests openpyxl

      - name: Run MA200 Screener
        run: python ma200_screener.py

      - name: Commit results
        uses: stefanzweifel/git-auto-commit-action@v6
        with:
          commit_message: "MA200 update ${{ github.run_id }} — ${{ github.run_number }}"
          file_pattern: 'data/ma200_*.xlsx data/ma200_prices.csv'
