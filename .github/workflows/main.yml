name: Daily Data Update

on:
  schedule:
    - cron: '0 10 * * 1-5' # 17:00 VN Time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-update:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas requests vnstock pyarrow

      - name: Run update script
        run: python daily_update.py

      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update daily stock data [$(date +'%Y-%m-%d')]"
          # Use '.' to ensure it grabs all new/modified files in any folder
          file_pattern: '.'
          # Ensure it uses the correct user to avoid permission errors
          commit_user_name: github-actions[bot]
          commit_user_email: github-actions[bot]@users.noreply.github.com
